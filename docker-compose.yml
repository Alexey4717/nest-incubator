services:
  postgres:
    image: postgres:16
    ports:
      # 5433 — чтобы не конфликтовать с локально установленным PostgreSQL на 5432
      - '5433:5432'
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: nest_incubator
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d nest_incubator']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
